[project]
name = "django-intro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aptitek", email = "aptitek@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "django-redis>=5.4.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
django-intro = "django_intro:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012"]
"manage.py" = ["EXE001"]
