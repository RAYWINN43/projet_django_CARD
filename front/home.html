{% load static %}

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Accueil connecte du jeu BlackJack." />
    <title>BlackJack - Accueil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Coiny&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'styles.css' %}" />
  </head>
  <body>
    <main class="app-shell">
      <section class="screen auth-screen welcome-screen" aria-labelledby="welcome-title">
        <a class="corner-brand" href="{% url 'home' %}" aria-label="Accueil">
          <img src="{% static 'assets/blackjack.png' %}" alt="" />
          <span class="brand-title">BlackJack</span>
        </a>

        <div class="welcome-content">
          <div class="welcome-card">
            <h1 class="welcome-title" id="welcome-title">
              Bienvenue {{ request.user.username }}, tu es connecte.
            </h1>

            <form class="welcome-actions" method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button class="welcome-logout" type="submit">Se deconnecter</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
