<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interface de jeu du jeu BlackJack."
    />
    <title>BlackJack — Partie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Coiny&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <div id="status">À vous de jouer</div>
    <button class="action_button" id="launch" onclick="launch()" style="visibility: visible;">Lancer</button>
    <button class="action_button" id="hit" onclick="play_turn('hit')" style="visibility: hidden;">Piocher</button>
    <button class="action_button" id="double" onclick="play_turn('double')" style="visibility: hidden;">Doubler</button>
    <button class="action_button" id="stop" onclick="play_turn('stop')" style="visibility: hidden;">Rester</button>

    <dialog id="bet-dialog">
      <form method="dialog">
        <p>Choisissez votre mise</p>
        <label for="bet-select">Mise :</label>
        <select id="bet-select">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30" selected>30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>
        <div>
          <button type="button" id="cancel-bet">Annuler</button>
          <button type="button" id="confirm-bet">Lancer</button>
        </div>
      </form>
    </dialog>
    
    <script>
        const gameId = "{{ game.id|default:'' }}";
        const isGameRunning = "{{ game.running|yesno:'true,false' }}" === "true";

        const launchButton = document.getElementById("launch");
        const hitButton = document.getElementById("hit");
        const doubleButton = document.getElementById("double");
        const stopButton = document.getElementById("stop");
        const betDialog = document.getElementById("bet-dialog");
        const betSelect = document.getElementById("bet-select");
        const confirmBetButton = document.getElementById("confirm-bet");
        const cancelBetButton = document.getElementById("cancel-bet");

        function syncButtons() {
            const hasGame = Boolean(gameId) && isGameRunning;

            launchButton.style.visibility = hasGame ? "hidden" : "visible";
            hitButton.style.visibility = hasGame ? "visible" : "hidden";
            doubleButton.style.visibility = hasGame ? "visible" : "hidden";
            stopButton.style.visibility = hasGame ? "visible" : "hidden";
        }

        function launch() {
            betDialog.showModal();
        }

        function startGameWithBet() {
            const bet = Number(betSelect.value);
            if (!Number.isInteger(bet) || bet <= 0) {
                return;
            }

            betDialog.close();
            window.location.href = `/game/launch?bet=${bet}`;
        }

        function play_turn(move) {
            if (!gameId) {
                launch();
                return;
            }

            window.location.href = `/game/${gameId}/play/${move}`;
        }

        confirmBetButton.addEventListener("click", startGameWithBet);
        cancelBetButton.addEventListener("click", () => betDialog.close());
        document.addEventListener("DOMContentLoaded", syncButtons);
    </script>
  </body>

</html>
